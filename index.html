<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>NHL Hockey</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script>
// --- Preload WASM chunks before engine starts ---
var WASM_CHUNKS = ['index.wasm.chunk0', 'index.wasm.chunk1'];
var WASM_TOTAL = 37700666;

var statusOverlay = document.getElementById('status');
var statusProgress = document.getElementById('status-progress');
var statusNotice = document.getElementById('status-notice');

function setStatusVisible() {
	statusOverlay.style.visibility = 'visible';
	statusProgress.style.display = 'block';
	statusNotice.style.display = 'block';
	statusNotice.textContent = 'Loading game data...';
}

setStatusVisible();

function loadWasmChunks() {
	return Promise.all(WASM_CHUNKS.map(function(chunk) {
		return fetch(chunk).then(function(r) {
			if (!r.ok) throw new Error('Failed to load ' + chunk + ': ' + r.status);
			return r.arrayBuffer();
		});
	})).then(function(buffers) {
		var combined = new Uint8Array(WASM_TOTAL);
		var offset = 0;
		for (var i = 0; i < buffers.length; i++) {
			combined.set(new Uint8Array(buffers[i]), offset);
			offset += buffers[i].byteLength;
		}
		var blob = new Blob([combined], { type: 'application/wasm' });
		globalThis._wasmBlobUrl = URL.createObjectURL(blob);
	});
}

loadWasmChunks().then(function() {
	// Load engine script after chunks are ready
	var script = document.createElement('script');
	script.src = 'index.js';
	script.onload = function() { startEngine(); };
	script.onerror = function() {
		statusNotice.textContent = 'Failed to load engine script.';
	};
	document.body.appendChild(script);
}).catch(function(err) {
	console.error('WASM loading failed:', err);
	statusNotice.textContent = 'Failed to load: ' + err.message;
});

function startEngine() {
	var GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":2951776},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
	var GODOT_THREADS_ENABLED = false;
	var engine = new Engine(GODOT_CONFIG);

	var initializing = true;
	var statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) return;
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) statusNotice.removeChild(statusNotice.lastChild);
		text.split('\n').forEach(function(line) {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) setStatusNotice(err.message);
		else if (typeof err === 'string') setStatusNotice(err);
		else setStatusNotice('An unknown error occurred.');
		setStatusMode('notice');
		initializing = false;
	}

	var missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });

	if (missing.length !== 0) {
		var missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
		displayFailureNotice(missingMsg + missing.join('\n'));
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(function() {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}
		</script>
	</body>
</html>
